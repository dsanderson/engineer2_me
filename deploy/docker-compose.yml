# engineer2.me — caddy (TLS + basic auth) → app (writer, owns /data) → runner (no egress)
#
#   cd deploy && cp .env.example .env && $EDITOR .env && docker compose up -d --build
#
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${E2_HTTP_PORT:-80}:80"
      - "${E2_HTTPS_PORT:-443}:443"
    environment:
      E2_SITE_ADDRESS: ${E2_SITE_ADDRESS:-localhost}
      E2_USER: ${E2_USER:-agent}
      E2_PASSWORD_HASH: ${E2_PASSWORD_HASH:?run `docker run --rm caddy:2 caddy hash-password --plaintext yourpassword`}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates survive restarts
      - caddy_config:/config
    depends_on:
      - app
    networks: [web]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    restart: unless-stopped
    # Run as the owner of the mounted data directory (see deploy/.env.example).
    user: "${E2_UID:-10001}:${E2_GID:-10001}"
    environment:
      E2_DATA_DIR: /data
      E2_BASE_URL: ${E2_BASE_URL:-http://localhost}
      E2_RUNNER_URL: http://runner:8001
      E2_RUN_TIMEOUT_S: ${E2_RUN_TIMEOUT_S:-30}
      ONSHAPE_ACCESS_KEY: ${ONSHAPE_ACCESS_KEY:-}
      ONSHAPE_SECRET_KEY: ${ONSHAPE_SECRET_KEY:-}
      E2_ONSHAPE_BASE: ${E2_ONSHAPE_BASE:-https://cad.onshape.com}
    volumes:
      - ${E2_DATA_HOST_DIR:-../data}:/data
    networks: [web, internal]
    depends_on:
      - runner

  runner:
    build:
      context: ..
      dockerfile: runner/Dockerfile
    restart: unless-stopped
    # Isolation: no route off the host, non-root, read-only rootfs, no capabilities.
    # This stops accidents and casual mischief — it is not a boundary against an attacker.
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${E2_RUNNER_MEM:-1g}
    pids_limit: 64

networks:
  web:
  internal:
    internal: true    # the runner has no route to the internet

volumes:
  caddy_data:
  caddy_config:
